name: Setup AgentOps
description: Python, AgentOps and Azure login (OIDC)
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: ci/pipeline/requirements.txt
    - shell: bash
      run: pip install -q -r ci/pipeline/requirements.txt
    - uses: azure/login@v2
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
